    <!--
      Decodifica o redirecionamento feito por public/404.html (GitHub Pages não
      tem servidor, então rotas como /intervencoes viram 404 sem isso). Roda
      antes do React Router montar. Padrão: rafgraph/spa-github-pages (MIT).
    -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
