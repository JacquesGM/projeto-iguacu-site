name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Alinha a versão do npm com a usada para gerar o package-lock.json
      # localmente (npm 10, do Node 20 da imagem do runner, resolve
      # dependências opcionais do esbuild de forma diferente do npm 11 e
      # rejeita o lock como "fora de sincronia" — não é o lock que está
      # errado, é a versão do npm).
      - run: npm install -g npm@11

      - run: npm ci

      - name: Checagem de tipos (tsc)
        run: npx tsc -b

      - name: Testes (vitest)
        run: npm run test -- --run

      - name: Build de produção
        run: npm run build

  # Ponta a ponta, num Chromium de verdade. E o unico lugar onde contraste de
  # cor, alvo de toque, graficos desenhados e navegacao por teclado sao
  # verificados -- em jsdom nao ha layout nem pintura, e essas regras estao
  # desligadas la de proposito.
  #
  # Job separado porque instalar o navegador leva ~1min: assim tipos, testes e
  # build continuam dando resposta rapida.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm install -g npm@11

      - run: npm ci

      # So o chromium: os dois formatos testados (desktop e Pixel 5) saem dele.
      - run: npx playwright install --with-deps chromium

      # O webServer da configuracao faz o build e sobe o `vite preview`.
      - name: Testes de ponta a ponta (Playwright)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7

  # Publica no Firebase Hosting so no push para master, e so depois de tipos,
  # testes e build passarem. Antes disto a publicacao era manual, o que
  # funciona enquanto for sempre a mesma pessoa e para de funcionar quando
  # nao for.
  #
  # Precisa do secret FIREBASE_SERVICE_ACCOUNT no repositorio (ver
  # app/README.md, secao "Publicacao"). Enquanto ele nao existir, o job e
  # PULADO em vez de falhar: um CI vermelho por configuracao ausente treina
  # todo mundo a ignorar CI vermelho.
  deploy:
    needs: [build-and-test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verifica se o secret de publicacao existe
        id: secret
        run: |
          if [ -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FIREBASE_SERVICE_ACCOUNT nao configurado; publicacao segue manual."
          fi

      - uses: actions/setup-node@v4
        if: steps.secret.outputs.existe == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm install -g npm@11
        if: steps.secret.outputs.existe == 'true'

      - run: npm ci
        if: steps.secret.outputs.existe == 'true'
        working-directory: app

      # Rebuild aqui em vez de carregar artefato do job anterior: sao ~5s, e
      # assim o que vai ao ar e comprovadamente o que este commit gera.
      - run: npm run build
        if: steps.secret.outputs.existe == 'true'
        working-directory: app

      - name: Publica no Firebase Hosting
        if: steps.secret.outputs.existe == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: carrinho-virtual-iw-48fc7
          channelId: live
